<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #1e293b; }
      .nav-item { fill: #334155; rx: 6; }
      .nav-item-active { fill: #3b82f6; rx: 6; }
      .nav-text { fill: #94a3b8; font-size: 11px; }
      .nav-text-active { fill: #ffffff; font-size: 11px; font-weight: 600; }
      .nav-icon { fill: #64748b; font-size: 14px; }
      .nav-icon-active { fill: #ffffff; font-size: 14px; }
      .section-title { fill: #64748b; font-size: 9px; font-weight: 600; letter-spacing: 1px; }
      .badge-new { fill: #ef4444; rx: 4; }
      .badge-text { fill: #ffffff; font-size: 7px; font-weight: 700; }
    </style>
  </defs>

  <!-- Sidebar background -->
  <rect width="240" height="620" class="bg" rx="8"/>

  <!-- Logo area -->
  <rect x="16" y="16" width="208" height="40" fill="#0f172a" rx="6"/>
  <text x="32" y="42" fill="#3b82f6" font-size="18" font-weight="700">HRM</text>
  <text x="72" y="42" fill="#94a3b8" font-size="11">人事管理系統</text>

  <!-- Section: 基礎模塊 -->
  <text x="16" y="80" class="section-title">基 礎 模 塊</text>

  <!-- Dashboard -->
  <rect x="12" y="90" width="216" height="36" class="nav-item"/>
  <text x="40" y="113" class="nav-icon">📊</text>
  <text x="60" y="113" class="nav-text">Dashboard</text>

  <!-- Directory -->
  <rect x="12" y="130" width="216" height="36" class="nav-item"/>
  <text x="40" y="153" class="nav-icon">👥</text>
  <text x="60" y="153" class="nav-text">員工名冊</text>

  <!-- Approvals -->
  <rect x="12" y="170" width="216" height="36" class="nav-item"/>
  <text x="40" y="193" class="nav-icon">✅</text>
  <text x="60" y="193" class="nav-text">請假審批</text>

  <!-- Section: 進階模塊 -->
  <text x="16" y="228" class="section-title">進 階 模 塊</text>

  <!-- Attendance -->
  <rect x="12" y="238" width="216" height="36" class="nav-item"/>
  <text x="40" y="261" class="nav-icon">🕐</text>
  <text x="60" y="261" class="nav-text">考勤管理</text>

  <!-- Payroll -->
  <rect x="12" y="278" width="216" height="36" class="nav-item"/>
  <text x="40" y="301" class="nav-icon">💰</text>
  <text x="60" y="301" class="nav-text">薪資管理</text>

  <!-- Recruitment -->
  <rect x="12" y="318" width="216" height="36" class="nav-item"/>
  <text x="40" y="341" class="nav-icon">📋</text>
  <text x="60" y="341" class="nav-text">招聘管理</text>

  <!-- Training -->
  <rect x="12" y="358" width="216" height="36" class="nav-item"/>
  <text x="40" y="381" class="nav-icon">🎓</text>
  <text x="60" y="381" class="nav-text">培訓管理</text>

  <!-- Section: 高級模塊 -->
  <text x="16" y="416" class="section-title">高 級 模 塊</text>

  <!-- Performance (active) -->
  <rect x="12" y="426" width="216" height="36" class="nav-item-active"/>
  <text x="40" y="449" class="nav-icon-active">🏆</text>
  <text x="60" y="449" class="nav-text-active">績效管理</text>
  <rect x="180" y="436" width="32" height="16" class="badge-new"/>
  <text x="186" y="448" class="badge-text">NEW</text>

  <!-- Reports -->
  <rect x="12" y="466" width="216" height="36" class="nav-item"/>
  <text x="40" y="489" class="nav-icon">📈</text>
  <text x="60" y="489" class="nav-text">報表中心</text>
  <rect x="180" y="476" width="32" height="16" class="badge-new"/>
  <text x="186" y="488" class="badge-text">NEW</text>

  <!-- Notifications -->
  <rect x="12" y="506" width="216" height="36" class="nav-item"/>
  <text x="40" y="529" class="nav-icon">🔔</text>
  <text x="60" y="529" class="nav-text">通知中心</text>
  <rect x="180" y="516" width="32" height="16" class="badge-new"/>
  <text x="186" y="528" class="badge-text">NEW</text>

  <!-- Settings -->
  <rect x="12" y="546" width="216" height="36" class="nav-item"/>
  <text x="40" y="569" class="nav-icon">⚙️</text>
  <text x="60" y="569" class="nav-text">系統設置</text>
  <rect x="180" y="556" width="32" height="16" class="badge-new"/>
  <text x="186" y="568" class="badge-text">NEW</text>

  <!-- User area -->
  <rect x="12" y="580" width="216" height="32" fill="#0f172a" rx="6"/>
  <circle cx="32" cy="596" r="10" fill="#475569"/>
  <text x="28" y="600" fill="#e2e8f0" font-size="10">👤</text>
  <text x="48" y="600" fill="#e2e8f0" font-size="10">管理員</text>
</svg>

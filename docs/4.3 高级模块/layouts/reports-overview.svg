<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #64748b; font-size: 12px; }
      .card-icon { font-size: 28px; }
      .card-title { fill: #1e293b; font-size: 14px; font-weight: 600; }
      .card-desc { fill: #64748b; font-size: 11px; }
      .card-link { fill: #3b82f6; font-size: 11px; font-weight: 500; }
      .icon-bg-blue { fill: #dbeafe; rx: 12; }
      .icon-bg-red { fill: #fee2e2; rx: 12; }
      .icon-bg-green { fill: #dcfce7; rx: 12; }
      .icon-bg-orange { fill: #ffedd5; rx: 12; }
      .icon-bg-purple { fill: #f3e8ff; rx: 12; }
    </style>
  </defs>

  <!-- Page title -->
  <text x="20" y="30" class="title">報表中心</text>
  <text x="20" y="48" class="subtitle">多維度人力資源數據分析</text>

  <!-- Card 1: 人數統計 -->
  <rect x="20" y="68" width="280" height="180" class="card"/>
  <rect x="40" y="88" width="48" height="48" class="icon-bg-blue"/>
  <text x="50" y="120" class="card-icon">👥</text>
  <text x="100" y="108" class="card-title">人數統計</text>
  <text x="100" y="126" class="card-desc">員工人數趨勢、部門分佈</text>
  <text x="100" y="226" class="card-link">查看報表 →</text>

  <!-- Card 2: 離職率分析 -->
  <rect x="310" y="68" width="280" height="180" class="card"/>
  <rect x="330" y="88" width="48" height="48" class="icon-bg-red"/>
  <text x="340" y="120" class="card-icon">📉</text>
  <text x="390" y="108" class="card-title">離職率分析</text>
  <text x="390" y="126" class="card-desc">離職率趨勢、原因分析</text>
  <text x="390" y="226" class="card-link">查看報表 →</text>

  <!-- Card 3: 薪資分析 -->
  <rect x="600" y="68" width="280" height="180" class="card"/>
  <rect x="620" y="88" width="48" height="48" class="icon-bg-green"/>
  <text x="630" y="120" class="card-icon">💰</text>
  <text x="680" y="108" class="card-title">薪資分析</text>
  <text x="680" y="126" class="card-desc">薪資分佈、部門對比</text>
  <text x="680" y="226" class="card-link">查看報表 →</text>

  <!-- Card 4: 考勤統計 -->
  <rect x="20" y="268" width="280" height="180" class="card"/>
  <rect x="40" y="288" width="48" height="48" class="icon-bg-orange"/>
  <text x="50" y="320" class="card-icon">🕐</text>
  <text x="100" y="308" class="card-title">考勤統計</text>
  <text x="100" y="326" class="card-desc">出勤率、遲到率趨勢</text>
  <text x="100" y="426" class="card-link">查看報表 →</text>

  <!-- Card 5: 績效分析 -->
  <rect x="310" y="268" width="280" height="180" class="card"/>
  <rect x="330" y="288" width="48" height="48" class="icon-bg-purple"/>
  <text x="340" y="320" class="card-icon">🏆</text>
  <text x="390" y="308" class="card-title">績效分析</text>
  <text x="390" y="326" class="card-desc">等級分佈、部門對比</text>
  <text x="390" y="426" class="card-link">查看報表 →</text>
</svg>

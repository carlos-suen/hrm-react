<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .tab { fill: #f1f5f9; rx: 6; }
      .tab-active { fill: #3b82f6; rx: 6; }
      .tab-text { fill: #64748b; font-size: 11px; }
      .tab-text-active { fill: #ffffff; font-size: 11px; font-weight: 600; }
      .badge-count { fill: #ef4444; rx: 8; }
      .badge-text { fill: #ffffff; font-size: 9px; font-weight: 700; }
      .btn-outline { fill: none; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .btn-outline-text { fill: #64748b; font-size: 11px; }
      .notif-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .notif-unread { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .unread-bar { fill: #ef4444; rx: 4 0 0 4; }
      .type-icon-bg { rx: 6; }
      .priority-urgent { fill: #ef4444; font-size: 12px; }
      .priority-high { fill: #f97316; font-size: 12px; }
      .priority-normal { fill: #3b82f6; font-size: 12px; }
      .notif-title { fill: #1e293b; font-size: 13px; font-weight: 600; }
      .notif-title-read { fill: #64748b; font-size: 13px; }
      .notif-msg { fill: #64748b; font-size: 11px; }
      .notif-time { fill: #94a3b8; font-size: 10px; }
      .action-link { fill: #3b82f6; font-size: 11px; }
      .action-muted { fill: #94a3b8; font-size: 11px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">通知中心</text>

  <!-- Tab bar -->
  <rect x="20" y="44" width="64" height="28" class="tab-active"/>
  <text x="32" y="63" class="tab-text-active">全部</text>

  <rect x="92" y="44" width="56" height="28" class="tab"/>
  <text x="100" y="63" class="tab-text">請假</text>

  <rect x="156" y="44" width="56" height="28" class="tab"/>
  <text x="164" y="63" class="tab-text">考勤</text>

  <rect x="220" y="44" width="56" height="28" class="tab"/>
  <text x="228" y="63" class="tab-text">薪資</text>

  <rect x="284" y="44" width="56" height="28" class="tab"/>
  <text x="292" y="63" class="tab-text">績效</text>

  <rect x="348" y="44" width="56" height="28" class="tab"/>
  <text x="356" y="63" class="tab-text">系統</text>

  <!-- Unread badge -->
  <text x="780" y="63" fill="#64748b" font-size="12">🔔</text>
  <rect x="794" y="48" width="18" height="16" class="badge-count"/>
  <text x="798" y="60" class="badge-text">5</text>

  <rect x="824" y="44" width="56" height="28" class="btn-outline"/>
  <text x="830" y="63" class="btn-outline-text">全部已讀</text>

  <!-- Notification 1: Unread, urgent -->
  <rect x="20" y="84" width="860" height="72" class="notif-unread"/>
  <rect x="20" y="84" width="4" height="72" class="unread-bar"/>
  <rect x="36" y="96" width="36" height="36" class="type-icon-bg" fill="#dbeafe"/>
  <text x="44" y="120" fill="#3b82f6" font-size="16">📋</text>
  <text x="84" y="108" class="notif-title">績效評估待完成</text>
  <text x="84" y="126" class="notif-msg">2026-H1 績效自評截止日期：6/15</text>
  <text x="840" y="108" class="notif-time">6/2</text>
  <text x="840" y="124" class="priority-urgent">🔴</text>
  <text x="84" y="146" class="action-link">查看詳情</text>
  <text x="160" y="146" class="action-muted">|</text>
  <text x="176" y="146" class="action-link">標記已讀</text>

  <!-- Notification 2: Unread, high -->
  <rect x="20" y="168" width="860" height="72" class="notif-unread"/>
  <rect x="20" y="168" width="4" height="72" class="unread-bar"/>
  <rect x="36" y="180" width="36" height="36" class="type-icon-bg" fill="#ffedd5"/>
  <text x="44" y="204" fill="#f97316" font-size="16">🕐</text>
  <text x="84" y="192" class="notif-title">考勤異常提醒</text>
  <text x="84" y="210" class="notif-msg">李娜今日遲到（09:45打卡）</text>
  <text x="840" y="192" class="notif-time">6/3</text>
  <text x="840" y="208" class="priority-high">🟠</text>
  <text x="84" y="230" class="action-link">查看詳情</text>
  <text x="160" y="230" class="action-muted">|</text>
  <text x="176" y="230" class="action-link">標記已讀</text>

  <!-- Notification 3: Unread, normal -->
  <rect x="20" y="252" width="860" height="72" class="notif-unread"/>
  <rect x="20" y="252" width="4" height="72" class="unread-bar"/>
  <rect x="36" y="264" width="36" height="36" class="type-icon-bg" fill="#dbeafe"/>
  <text x="44" y="288" fill="#3b82f6" font-size="16">📅</text>
  <text x="84" y="276" class="notif-title">請假申請待審批</text>
  <text x="84" y="294" class="notif-msg">張偉提交了年假申請（6/5-6/7，3天）</text>
  <text x="840" y="276" class="notif-time">6/3</text>
  <text x="840" y="292" class="priority-normal">🔵</text>
  <text x="84" y="314" class="action-link">查看詳情</text>
  <text x="160" y="314" class="action-muted">|</text>
  <text x="176" y="314" class="action-link">標記已讀</text>

  <!-- Notification 4: Read -->
  <rect x="20" y="336" width="860" height="72" class="notif-card" fill="#f8fafc"/>
  <rect x="36" y="348" width="36" height="36" class="type-icon-bg" fill="#dcfce7"/>
  <text x="44" y="372" fill="#22c55e" font-size="16">💰</text>
  <text x="84" y="360" class="notif-title-read">薪資單已確認</text>
  <text x="84" y="378" class="notif-msg">2026年5月薪資單已生成，請確認</text>
  <text x="840" y="360" class="notif-time">6/1</text>
  <text x="84" y="398" class="action-link">查看詳情</text>

  <!-- Notification 5: Read -->
  <rect x="20" y="420" width="860" height="72" class="notif-card" fill="#f8fafc"/>
  <rect x="36" y="432" width="36" height="36" class="type-icon-bg" fill="#f1f5f9"/>
  <text x="44" y="456" fill="#64748b" font-size="16">⚙️</text>
  <text x="84" y="444" class="notif-title-read">系統維護通知</text>
  <text x="84" y="462" class="notif-msg">系統將於6/8 02:00-04:00進行維護</text>
  <text x="840" y="444" class="notif-time">5/30</text>
  <text x="84" y="482" class="action-link">查看詳情</text>
</svg>

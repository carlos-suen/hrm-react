<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .icon-bg { fill: #dbeafe; rx: 12; }
      .icon { fill: #3b82f6; font-size: 24px; }
      .title { fill: #1e293b; font-size: 14px; font-weight: 600; }
      .desc { fill: #64748b; font-size: 11px; }
      .link { fill: #3b82f6; font-size: 11px; font-weight: 500; }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="280" height="180" class="card"/>

  <!-- Icon with background circle -->
  <rect x="24" y="20" width="48" height="48" class="icon-bg"/>
  <text x="32" y="52" class="icon">👥</text>

  <!-- Title -->
  <text x="84" y="42" class="title">人數統計</text>

  <!-- Description -->
  <text x="24" y="90" class="desc">員工人數趨勢、部門分佈</text>

  <!-- Link button -->
  <text x="24" y="156" class="link">查看報表 →</text>

  <!-- Annotation arrows -->
  <line x1="160" y1="42" x2="200" y2="42" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="204" y="46" fill="#94a3b8" font-size="9">text-lg font-semibold</text>

  <line x1="160" y1="90" x2="200" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="204" y="94" fill="#94a3b8" font-size="9">text-sm text-slate-500</text>

  <line x1="100" y1="156" x2="140" y2="156" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="144" y="160" fill="#94a3b8" font-size="9">text-blue-600</text>
</svg>

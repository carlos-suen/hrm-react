<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .modal-bg { fill: #f1f5f9; rx: 12; }
      .modal-header { fill: #ffffff; rx: 12 12 0 0; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .label { fill: #64748b; font-size: 11px; font-weight: 500; }
      .input { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .input-text { fill: #1e293b; font-size: 12px; }
      .slider-track { fill: #e2e8f0; rx: 4; }
      .slider-fill { fill: #3b82f6; rx: 4; }
      .slider-thumb { fill: #3b82f6; }
      .score-display { fill: #3b82f6; font-size: 16px; font-weight: 700; }
      .btn-primary { fill: #3b82f6; rx: 6; }
      .btn-outline { fill: none; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .btn-text { fill: #ffffff; font-size: 12px; font-weight: 600; }
      .btn-outline-text { fill: #64748b; font-size: 12px; }
      .close { fill: #94a3b8; font-size: 16px; }
    </style>
  </defs>

  <!-- Modal overlay -->
  <rect width="520" height="560" fill="#0f172a" opacity="0.3" rx="0"/>

  <!-- Modal container -->
  <rect x="40" y="20" width="440" height="520" class="modal-bg"/>

  <!-- Header -->
  <rect x="40" y="20" width="440" height="48" class="modal-header"/>
  <text x="60" y="50" class="title">新增績效評估</text>
  <text x="448" y="50" class="close">✕</text>

  <!-- Form fields -->
  <!-- Row 1: 員工選擇 -->
  <text x="60" y="96" class="label">員工選擇 *</text>
  <rect x="60" y="104" width="400" height="36" class="input"/>
  <text x="76" y="127" class="input-text" fill-opacity="0.5">選擇員工...</text>

  <!-- Row 2: 評估週期 + 評審人 -->
  <text x="60" y="164" class="label">評估週期 *</text>
  <rect x="60" y="172" width="190" height="36" class="input"/>
  <text x="76" y="195" class="input-text">2026-H1</text>

  <text x="270" y="164" class="label">評審人 *</text>
  <rect x="270" y="172" width="190" height="36" class="input"/>
  <text x="286" y="195" class="input-text" fill-opacity="0.5">選擇評審人...</text>

  <!-- Divider -->
  <line x1="60" y1="224" x2="460" y2="224" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="244" fill="#1e293b" font-size="13" font-weight="600">五維評分</text>

  <!-- Slider 1: 工作質量 -->
  <text x="60" y="272" class="label" fill="#1e293b" font-weight="600">工作質量</text>
  <rect x="160" y="264" width="220" height="6" class="slider-track"/>
  <rect x="160" y="264" width="176" height="6" class="slider-fill"/>
  <circle cx="336" cy="267" r="8" class="slider-thumb"/>
  <text x="400" y="274" class="score-display">4.0</text>

  <!-- Slider 2: 工作效率 -->
  <text x="60" y="308" class="label" fill="#1e293b" font-weight="600">工作效率</text>
  <rect x="160" y="300" width="220" height="6" class="slider-track"/>
  <rect x="160" y="300" width="154" height="6" class="slider-fill"/>
  <circle cx="314" cy="303" r="8" class="slider-thumb"/>
  <text x="400" y="310" class="score-display">3.5</text>

  <!-- Slider 3: 團隊協作 -->
  <text x="60" y="344" class="label" fill="#1e293b" font-weight="600">團隊協作</text>
  <rect x="160" y="336" width="220" height="6" class="slider-track"/>
  <rect x="160" y="336" width="198" height="6" class="slider-fill"/>
  <circle cx="358" cy="339" r="8" class="slider-thumb"/>
  <text x="400" y="346" class="score-display">4.5</text>

  <!-- Slider 4: 主動性 -->
  <text x="60" y="380" class="label" fill="#1e293b" font-weight="600">主動性</text>
  <rect x="160" y="372" width="220" height="6" class="slider-track"/>
  <rect x="160" y="372" width="176" height="6" class="slider-fill"/>
  <circle cx="336" cy="375" r="8" class="slider-thumb"/>
  <text x="400" y="382" class="score-display">4.0</text>

  <!-- Slider 5: 溝通能力 -->
  <text x="60" y="416" class="label" fill="#1e293b" font-weight="600">溝通能力</text>
  <rect x="160" y="408" width="220" height="6" class="slider-track"/>
  <rect x="160" y="408" width="132" height="6" class="slider-fill"/>
  <circle cx="292" cy="411" r="8" class="slider-thumb"/>
  <text x="400" y="418" class="score-display">3.0</text>

  <!-- Divider -->
  <line x1="60" y1="436" x2="460" y2="436" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 評語 -->
  <text x="60" y="456" class="label">評語</text>
  <rect x="60" y="464" width="400" height="40" class="input"/>
  <text x="76" y="488" class="input-text" fill-opacity="0.5">輸入評語...</text>

  <!-- Buttons -->
  <rect x="280" y="516" width="80" height="32" class="btn-outline"/>
  <text x="304" y="537" class="btn-outline-text">取消</text>
  <rect x="372" y="516" width="88" height="32" class="btn-primary"/>
  <text x="392" y="537" class="btn-text">提交評估</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .unread-bar { fill: #ef4444; rx: 4 0 0 4; }
      .type-icon-bg { rx: 6; }
      .notif-title { fill: #1e293b; font-size: 13px; font-weight: 600; }
      .notif-msg { fill: #64748b; font-size: 11px; }
      .notif-time { fill: #94a3b8; font-size: 10px; }
      .action-link { fill: #3b82f6; font-size: 11px; }
      .action-muted { fill: #94a3b8; font-size: 11px; }
    </style>
  </defs>

  <!-- Notification card -->
  <rect x="0" y="0" width="480" height="160" class="card"/>
  <rect x="0" y="0" width="4" height="160" class="unread-bar"/>

  <!-- Type icon -->
  <rect x="16" y="16" width="40" height="40" class="type-icon-bg" fill="#dbeafe"/>
  <text x="24" y="42" fill="#3b82f6" font-size="18">📅</text>

  <!-- Title + priority + time -->
  <text x="68" y="32" class="notif-title">請假申請待審批</text>
  <text x="420" y="32" class="notif-time">10:30</text>

  <!-- Message -->
  <text x="68" y="52" class="notif-msg">張偉提交了年假申請（6/5-6/7，3天）</text>

  <!-- Detail line -->
  <text x="68" y="76" fill="#94a3b8" font-size="10">類型：年假 | 日期：6/5-6/7 | 天數：3天</text>

  <!-- Actions -->
  <rect x="68" y="96" width="72" height="28" fill="#3b82f6" rx="6"/>
  <text x="80" y="115" fill="#ffffff" font-size="11" font-weight="600">查看詳情</text>

  <rect x="152" y="96" width="72" height="28" fill="none" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="164" y="115" fill="#64748b" font-size="11">標記已讀</text>

  <!-- Priority indicator -->
  <text x="68" y="144" fill="#f97316" font-size="10">● 優先級：高</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .card-dark { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #64748b; font-size: 12px; }
      .metric-value { fill: #1e293b; font-size: 28px; font-weight: 700; }
      .metric-label { fill: #64748b; font-size: 11px; }
      .chart-area { fill: #f8fafc; stroke: #e2e8f0; rx: 8; }
      .bar-s { fill: #8b5cf6; }
      .bar-a { fill: #3b82f6; }
      .bar-b { fill: #22c55e; }
      .bar-c { fill: #f97316; }
      .bar-d { fill: #ef4444; }
      .axis-text { fill: #94a3b8; font-size: 10px; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; }
    </style>
  </defs>

  <!-- Page title -->
  <text x="20" y="30" class="title">績效管理</text>
  <text x="20" y="48" class="subtitle">2026-H1 評估週期</text>

  <!-- Stat cards row -->
  <!-- Card 1: 本期評估人數 -->
  <rect x="20" y="64" width="200" height="80" class="card"/>
  <text x="36" y="88" class="metric-label">📊 本期評估人數</text>
  <text x="36" y="124" class="metric-value">8</text>
  <text x="80" y="124" fill="#22c55e" font-size="12">已完成 5</text>

  <!-- Card 2: 平均績效分 -->
  <rect x="240" y="64" width="200" height="80" class="card"/>
  <text x="256" y="88" class="metric-label">📈 平均績效分</text>
  <text x="256" y="124" class="metric-value">3.7</text>
  <text x="310" y="124" fill="#64748b" font-size="12">/ 5.0</text>

  <!-- Card 3: S/A 級佔比 -->
  <rect x="460" y="64" width="200" height="80" class="card"/>
  <text x="476" y="88" class="metric-label">🏆 S/A 級佔比</text>
  <text x="476" y="124" class="metric-value">50%</text>
  <text x="540" y="124" fill="#8b5cf6" font-size="12">4/8 人</text>

  <!-- Card 4: 待審核數 -->
  <rect x="680" y="64" width="200" height="80" class="card"/>
  <text x="696" y="88" class="metric-label">⏳ 待審核數</text>
  <text x="696" y="124" class="metric-value">3</text>
  <text x="724" y="124" fill="#f97316" font-size="12">待處理</text>

  <!-- Chart 1: 等級分佈柱狀圖 -->
  <rect x="20" y="164" width="420" height="320" class="chart-area"/>
  <text x="36" y="190" fill="#1e293b" font-size="13" font-weight="600">等級分佈</text>

  <!-- Y axis -->
  <line x1="70" y1="210" x2="70" y2="450" class="grid-line"/>
  <text x="50" y="450" class="axis-text">0</text>
  <text x="44" y="390" class="axis-text">1</text>
  <text x="44" y="330" class="axis-text">2</text>
  <text x="44" y="270" class="axis-text">3</text>
  <text x="44" y="210" class="axis-text">4</text>

  <!-- Grid lines -->
  <line x1="70" y1="390" x2="410" y2="390" class="grid-line"/>
  <line x1="70" y1="330" x2="410" y2="330" class="grid-line"/>
  <line x1="70" y1="270" x2="410" y2="270" class="grid-line"/>
  <line x1="70" y1="210" x2="410" y2="210" class="grid-line"/>

  <!-- Bars -->
  <rect x="100" y="390" width="40" height="60" class="bar-s" rx="4"/>
  <text x="112" y="450" class="axis-text">S</text>
  <text x="108" y="384" fill="#8b5cf6" font-size="11" font-weight="600">1</text>

  <rect x="170" y="210" width="40" height="240" class="bar-a" rx="4"/>
  <text x="182" y="450" class="axis-text">A</text>
  <text x="178" y="204" fill="#3b82f6" font-size="11" font-weight="600">3</text>

  <rect x="240" y="270" width="40" height="180" class="bar-b" rx="4"/>
  <text x="252" y="450" class="axis-text">B</text>
  <text x="248" y="264" fill="#22c55e" font-size="11" font-weight="600">3</text>

  <rect x="310" y="390" width="40" height="60" class="bar-c" rx="4"/>
  <text x="322" y="450" class="axis-text">C</text>
  <text x="318" y="384" fill="#f97316" font-size="11" font-weight="600">1</text>

  <rect x="380" y="450" width="40" height="0" class="bar-d" rx="4"/>
  <text x="392" y="450" class="axis-text">D</text>
  <text x="388" y="444" fill="#ef4444" font-size="11" font-weight="600">0</text>

  <!-- Chart 2: 部門績效對比橫向柱狀圖 -->
  <rect x="460" y="164" width="420" height="320" class="chart-area"/>
  <text x="476" y="190" fill="#1e293b" font-size="13" font-weight="600">部門績效對比</text>

  <!-- Department bars -->
  <text x="476" y="230" fill="#64748b" font-size="11">Engineering</text>
  <rect x="580" y="218" width="200" height="18" fill="#3b82f6" rx="4" opacity="0.8"/>
  <text x="786" y="232" fill="#1e293b" font-size="11" font-weight="600">4.2</text>

  <text x="476" y="270" fill="#64748b" font-size="11">HR</text>
  <rect x="580" y="258" width="190" height="18" fill="#3b82f6" rx="4" opacity="0.7"/>
  <text x="776" y="272" fill="#1e293b" font-size="11" font-weight="600">4.1</text>

  <text x="476" y="310" fill="#64748b" font-size="11">Marketing</text>
  <rect x="580" y="298" width="160" height="18" fill="#3b82f6" rx="4" opacity="0.6"/>
  <text x="746" y="312" fill="#1e293b" font-size="11" font-weight="600">3.3</text>

  <text x="476" y="350" fill="#64748b" font-size="11">Finance</text>
  <rect x="580" y="338" width="155" height="18" fill="#3b82f6" rx="4" opacity="0.5"/>
  <text x="741" y="352" fill="#1e293b" font-size="11" font-weight="600">3.3</text>

  <text x="476" y="390" fill="#64748b" font-size="11">Sales</text>
  <rect x="580" y="378" width="140" height="18" fill="#3b82f6" rx="4" opacity="0.4"/>
  <text x="726" y="392" fill="#1e293b" font-size="11" font-weight="600">3.0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .filter { fill: #f1f5f9; stroke: #e2e8f0; rx: 6; }
      .filter-text { fill: #64748b; font-size: 11px; }
      .btn-outline { fill: none; stroke: #e2e8f0; stroke-width: 1; rx: 6; }
      .btn-outline-text { fill: #64748b; font-size: 11px; }
      .chart-area { fill: #f8fafc; stroke: #e2e8f0; rx: 8; }
      .chart-title { fill: #1e293b; font-size: 13px; font-weight: 600; }
      .axis-text { fill: #94a3b8; font-size: 10px; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; }
      .area-total { fill: #3b82f6; fill-opacity: 0.15; }
      .line-total { fill: none; stroke: #3b82f6; stroke-width: 2; }
      .area-new { fill: #22c55e; fill-opacity: 0.15; }
      .line-new { fill: none; stroke: #22c55e; stroke-width: 2; }
      .area-left { fill: #ef4444; fill-opacity: 0.15; }
      .line-left { fill: none; stroke: #ef4444; stroke-width: 2; }
      .th-text { fill: #64748b; font-size: 11px; font-weight: 600; }
      .td-text { fill: #1e293b; font-size: 12px; }
      .td-positive { fill: #22c55e; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">人數統計報表</text>

  <!-- Filter bar -->
  <rect x="20" y="44" width="130" height="32" class="filter"/>
  <text x="36" y="65" class="filter-text">📅 開始: 2026-01</text>
  <rect x="162" y="44" width="130" height="32" class="filter"/>
  <text x="178" y="65" class="filter-text">📅 結束: 2026-06</text>
  <rect x="304" y="44" width="110" height="32" class="filter"/>
  <text x="320" y="65" class="filter-text">🏢 部門: 全部</text>
  <rect x="780" y="44" width="100" height="32" class="btn-outline"/>
  <text x="800" y="65" class="btn-outline-text">📥 導出 CSV</text>

  <!-- Chart 1: Area chart -->
  <rect x="20" y="88" width="420" height="240" class="chart-area"/>
  <text x="36" y="112" class="chart-title">人數趨勢</text>

  <!-- Legend -->
  <line x1="300" y1="106" x2="320" y2="106" stroke="#3b82f6" stroke-width="2"/>
  <text x="324" y="110" fill="#64748b" font-size="9">總人數</text>
  <line x1="370" y1="106" x2="390" y2="106" stroke="#22c55e" stroke-width="2"/>
  <text x="394" y="110" fill="#64748b" font-size="9">新入職</text>

  <!-- Y axis -->
  <text x="44" y="300" class="axis-text">40</text>
  <text x="44" y="260" class="axis-text">45</text>
  <text x="44" y="220" class="axis-text">50</text>
  <text x="44" y="180" class="axis-text">55</text>

  <!-- Grid lines -->
  <line x1="60" y1="296" x2="420" y2="296" class="grid-line"/>
  <line x1="60" y1="256" x2="420" y2="296" class="grid-line" opacity="0"/>

  <!-- Area chart lines (simplified) -->
  <path d="M60,280 L120,270 L180,260 L240,250 L300,240 L360,230 L420,220 L420,296 L60,296 Z" class="area-total"/>
  <path d="M60,280 L120,270 L180,260 L240,250 L300,240 L360,230 L420,220" class="line-total"/>

  <path d="M60,296 L120,288 L180,284 L240,280 L300,276 L360,272 L420,268 L420,296 L60,296 Z" class="area-new"/>
  <path d="M60,296 L120,288 L180,284 L240,280 L300,276 L360,272 L420,268" class="line-new"/>

  <!-- X axis labels -->
  <text x="56" y="312" class="axis-text">1月</text>
  <text x="116" y="312" class="axis-text">2月</text>
  <text x="176" y="312" class="axis-text">3月</text>
  <text x="236" y="312" class="axis-text">4月</text>
  <text x="296" y="312" class="axis-text">5月</text>
  <text x="356" y="312" class="axis-text">6月</text>

  <!-- Chart 2: Pie chart -->
  <rect x="460" y="88" width="420" height="240" class="chart-area"/>
  <text x="476" y="112" class="chart-title">部門分佈</text>

  <!-- Simplified pie chart -->
  <circle cx="620" cy="210" r="80" fill="#3b82f6"/>
  <path d="M620,210 L620,130 A80,80 0 0,1 696,170 Z" fill="#22c55e"/>
  <path d="M620,210 L696,170 A80,80 0 0,1 700,210 Z" fill="#f97316"/>
  <path d="M620,210 L700,210 A80,80 0 0,1 680,262 Z" fill="#8b5cf6"/>
  <path d="M620,210 L680,262 A80,80 0 0,1 560,262 Z" fill="#ec4899"/>

  <!-- Pie legend -->
  <rect x="740" y="150" width="10" height="10" fill="#3b82f6" rx="2"/>
  <text x="756" y="160" fill="#64748b" font-size="10">Engineering 35%</text>
  <rect x="740" y="170" width="10" height="10" fill="#22c55e" rx="2"/>
  <text x="756" y="180" fill="#64748b" font-size="10">Marketing 20%</text>
  <rect x="740" y="190" width="10" height="10" fill="#f97316" rx="2"/>
  <text x="756" y="200" fill="#64748b" font-size="10">Sales 15%</text>
  <rect x="740" y="210" width="10" height="10" fill="#8b5cf6" rx="2"/>
  <text x="756" y="220" fill="#64748b" font-size="10">HR 15%</text>
  <rect x="740" y="230" width="10" height="10" fill="#ec4899" rx="2"/>
  <text x="756" y="240" fill="#64748b" font-size="10">Finance 15%</text>

  <!-- Data table -->
  <rect x="20" y="344" width="860" height="240" class="card"/>
  <text x="36" y="368" class="chart-title">月度明細</text>

  <!-- Table header -->
  <rect x="36" y="380" width="828" height="28" fill="#f8fafc" rx="4"/>
  <text x="52" y="399" class="th-text">月份</text>
  <text x="160" y="399" class="th-text">總人數</text>
  <text x="280" y="399" class="th-text">新入職</text>
  <text x="400" y="399" class="th-text">離職</text>
  <text x="520" y="399" class="th-text">淨增長</text>
  <text x="640" y="399" class="th-text">出勤率</text>
  <text x="760" y="399" class="th-text">趨勢</text>

  <!-- Row 1 -->
  <text x="52" y="430" class="td-text" font-family="monospace">2026-01</text>
  <text x="160" y="430" class="td-text">48</text>
  <text x="280" y="430" class="td-text">3</text>
  <text x="400" y="430" class="td-text">1</text>
  <text x="520" y="430" class="td-positive">+2</text>
  <text x="640" y="430" class="td-text">96.2%</text>
  <text x="760" y="430" fill="#22c55e" font-size="12">↑</text>

  <!-- Row 2 -->
  <rect x="36" y="440" width="828" height="28" fill="#f8fafc" rx="2"/>
  <text x="52" y="460" class="td-text" font-family="monospace">2026-02</text>
  <text x="160" y="460" class="td-text">50</text>
  <text x="280" y="460" class="td-text">4</text>
  <text x="400" y="460" class="td-text">2</text>
  <text x="520" y="460" class="td-positive">+2</text>
  <text x="640" y="460" class="td-text">95.8%</text>
  <text x="760" y="460" fill="#22c55e" font-size="12">↑</text>

  <!-- Row 3 -->
  <text x="52" y="490" class="td-text" font-family="monospace">2026-03</text>
  <text x="160" y="490" class="td-text">52</text>
  <text x="280" y="490" class="td-text">3</text>
  <text x="400" y="490" class="td-text">1</text>
  <text x="520" y="490" class="td-positive">+2</text>
  <text x="640" y="490" class="td-text">97.1%</text>
  <text x="760" y="490" fill="#22c55e" font-size="12">↑</text>

  <!-- Row 4 -->
  <rect x="36" y="500" width="828" height="28" fill="#f8fafc" rx="2"/>
  <text x="52" y="520" class="td-text" font-family="monospace">2026-04</text>
  <text x="160" y="520" class="td-text">53</text>
  <text x="280" y="520" class="td-text">2</text>
  <text x="400" y="520" class="td-text">1</text>
  <text x="520" y="520" class="td-positive">+1</text>
  <text x="640" y="520" class="td-text">96.5%</text>
  <text x="760" y="520" fill="#94a3b8" font-size="12">→</text>

  <!-- Row 5 -->
  <text x="52" y="550" class="td-text" font-family="monospace">2026-05</text>
  <text x="160" y="550" class="td-text">55</text>
  <text x="280" y="550" class="td-text">4</text>
  <text x="400" y="550" class="td-text">2</text>
  <text x="520" y="550" class="td-positive">+2</text>
  <text x="640" y="550" class="td-text">95.3%</text>
  <text x="760" y="550" fill="#22c55e" font-size="12">↑</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .icon { font-size: 20px; }
      .title { fill: #1e293b; font-size: 13px; font-weight: 600; }
      .desc { fill: #64748b; font-size: 11px; }
      .link { fill: #3b82f6; font-size: 11px; font-weight: 500; }
    </style>
  </defs>

  <!-- Card -->
  <rect width="280" height="140" class="card"/>

  <!-- Icon + Title -->
  <text x="20" y="36" class="icon">🏢</text>
  <text x="48" y="36" class="title">公司信息</text>

  <!-- Description -->
  <text x="20" y="64" class="desc">公司名稱、財年、工作時間</text>

  <!-- Link -->
  <text x="20" y="116" class="link">進入設置 →</text>

  <!-- Annotations -->
  <line x1="120" y1="36" x2="160" y2="36" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="164" y="40" fill="#94a3b8" font-size="9">圖標 + 標題</text>

  <line x1="140" y1="64" x2="180" y2="64" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="184" y="68" fill="#94a3b8" font-size="9">描述</text>

  <line x1="100" y1="116" x2="140" y2="116" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="144" y="120" fill="#94a3b8" font-size="9">鏈接</text>
</svg>

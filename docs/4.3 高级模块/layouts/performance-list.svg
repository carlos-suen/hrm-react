<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #64748b; font-size: 12px; }
      .filter { fill: #f1f5f9; stroke: #e2e8f0; rx: 6; }
      .filter-text { fill: #64748b; font-size: 11px; }
      .table-header { fill: #f8fafc; }
      .th-text { fill: #64748b; font-size: 11px; font-weight: 600; }
      .td-text { fill: #1e293b; font-size: 12px; }
      .badge { rx: 4; }
      .badge-s { fill: #f3e8ff; }
      .badge-a { fill: #dbeafe; }
      .badge-b { fill: #dcfce7; }
      .badge-c { fill: #ffedd5; }
      .badge-d { fill: #fee2e2; }
      .badge-text-s { fill: #7c3aed; font-size: 13px; font-weight: 700; }
      .badge-text-a { fill: #2563eb; font-size: 13px; font-weight: 700; }
      .badge-text-b { fill: #16a34a; font-size: 13px; font-weight: 700; }
      .badge-text-c { fill: #ea580c; font-size: 13px; font-weight: 700; }
      .badge-text-d { fill: #dc2626; font-size: 13px; font-weight: 700; }
      .status-badge { rx: 4; }
      .status-completed { fill: #dcfce7; }
      .status-review { fill: #dbeafe; }
      .status-self { fill: #fef3c7; }
      .btn { fill: #3b82f6; rx: 6; }
      .btn-text { fill: #ffffff; font-size: 11px; font-weight: 600; }
      .row-hover { fill: #f8fafc; }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" class="title">績效評估列表</text>

  <!-- Filter bar -->
  <rect x="20" y="44" width="120" height="32" class="filter"/>
  <text x="36" y="65" class="filter-text">📅 週期: 2026-H1</text>

  <rect x="152" y="44" width="110" height="32" class="filter"/>
  <text x="168" y="65" class="filter-text">🏢 部門: 全部</text>

  <rect x="274" y="44" width="100" height="32" class="filter"/>
  <text x="290" y="65" class="filter-text">⭐ 等級: 全部</text>

  <rect x="386" y="44" width="110" height="32" class="filter"/>
  <text x="402" y="65" class="filter-text">📋 狀態: 全部</text>

  <rect x="760" y="44" width="120" height="32" class="btn"/>
  <text x="784" y="65" class="btn-text">+ 新增評估</text>

  <!-- Table header -->
  <rect x="20" y="88" width="860" height="36" class="table-header" rx="6"/>
  <text x="36" y="112" class="th-text">員工</text>
  <text x="180" y="112" class="th-text">部門</text>
  <text x="280" y="112" class="th-text">週期</text>
  <text x="360" y="112" class="th-text">總分</text>
  <text x="430" y="112" class="th-text">等級</text>
  <text x="510" y="112" class="th-text">狀態</text>
  <text x="630" y="112" class="th-text">評審人</text>
  <text x="780" y="112" class="th-text">操作</text>

  <!-- Row 1 -->
  <rect x="20" y="128" width="860" height="40" class="row-hover" rx="4"/>
  <circle cx="44" cy="148" r="12" fill="#3b82f6"/>
  <text x="38" y="153" fill="#fff" font-size="10">張</text>
  <text x="64" y="153" class="td-text">張偉</text>
  <text x="180" y="153" class="td-text">Engineering</text>
  <text x="280" y="153" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="153" class="td-text">4.1</text>
  <rect x="424" y="138" width="28" height="22" class="badge badge-a"/>
  <text x="430" y="154" class="badge-text-a">A</text>
  <rect x="500" y="138" width="72" height="22" class="status-badge status-completed"/>
  <text x="510" y="154" fill="#16a34a" font-size="10" font-weight="600">Completed</text>
  <text x="630" y="153" class="td-text">王強</text>
  <text x="780" y="153" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Row 2 -->
  <rect x="20" y="172" width="860" height="40" rx="4"/>
  <circle cx="44" cy="192" r="12" fill="#ec4899"/>
  <text x="38" y="197" fill="#fff" font-size="10">李</text>
  <text x="64" y="197" class="td-text">李娜</text>
  <text x="180" y="197" class="td-text">Marketing</text>
  <text x="280" y="197" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="197" class="td-text">4.1</text>
  <rect x="424" y="182" width="28" height="22" class="badge badge-a"/>
  <text x="430" y="198" class="badge-text-a">A</text>
  <rect x="500" y="182" width="96" height="22" class="status-badge status-review"/>
  <text x="510" y="198" fill="#2563eb" font-size="10" font-weight="600">Manager Review</text>
  <text x="630" y="197" class="td-text">趙敏</text>
  <text x="780" y="197" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Row 3 -->
  <rect x="20" y="216" width="860" height="40" class="row-hover" rx="4"/>
  <circle cx="44" cy="236" r="12" fill="#3b82f6"/>
  <text x="38" y="241" fill="#fff" font-size="10">王</text>
  <text x="64" y="241" class="td-text">王強</text>
  <text x="180" y="241" class="td-text">Engineering</text>
  <text x="280" y="241" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="241" class="td-text">3.9</text>
  <rect x="424" y="226" width="28" height="22" class="badge badge-b"/>
  <text x="430" y="242" class="badge-text-b">B</text>
  <rect x="500" y="226" width="72" height="22" class="status-badge status-review"/>
  <text x="510" y="242" fill="#2563eb" font-size="10" font-weight="600">HR Review</text>
  <text x="630" y="241" class="td-text">劉洋</text>
  <text x="780" y="241" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Row 4 -->
  <rect x="20" y="260" width="860" height="40" rx="4"/>
  <circle cx="44" cy="280" r="12" fill="#f97316"/>
  <text x="38" y="285" fill="#fff" font-size="10">趙</text>
  <text x="64" y="285" class="td-text">趙敏</text>
  <text x="180" y="285" class="td-text">HR</text>
  <text x="280" y="285" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="285" class="td-text">4.1</text>
  <rect x="424" y="270" width="28" height="22" class="badge badge-a"/>
  <text x="430" y="286" class="badge-text-a">A</text>
  <rect x="500" y="270" width="72" height="22" class="status-badge status-completed"/>
  <text x="510" y="286" fill="#16a34a" font-size="10" font-weight="600">Completed</text>
  <text x="630" y="285" class="td-text">陳思</text>
  <text x="780" y="285" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Row 5 -->
  <rect x="20" y="304" width="860" height="40" class="row-hover" rx="4"/>
  <circle cx="44" cy="324" r="12" fill="#22c55e"/>
  <text x="38" y="329" fill="#fff" font-size="10">陳</text>
  <text x="64" y="329" class="td-text">陳思</text>
  <text x="180" y="329" class="td-text">Finance</text>
  <text x="280" y="329" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="329" class="td-text">3.3</text>
  <rect x="424" y="314" width="28" height="22" class="badge badge-b"/>
  <text x="430" y="330" class="badge-text-b">B</text>
  <rect x="500" y="314" width="72" height="22" class="status-badge status-self"/>
  <text x="510" y="330" fill="#d97706" font-size="10" font-weight="600">Self Review</text>
  <text x="630" y="329" class="td-text">張偉</text>
  <text x="780" y="329" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Row 6 -->
  <rect x="20" y="348" width="860" height="40" rx="4"/>
  <circle cx="44" cy="368" r="12" fill="#8b5cf6"/>
  <text x="38" y="373" fill="#fff" font-size="10">劉</text>
  <text x="64" y="373" class="td-text">劉洋</text>
  <text x="180" y="373" class="td-text">Engineering</text>
  <text x="280" y="373" class="td-text" font-family="monospace">2026-H1</text>
  <text x="360" y="373" class="td-text">4.6</text>
  <rect x="424" y="358" width="28" height="22" class="badge badge-s"/>
  <text x="430" y="374" class="badge-text-s">S</text>
  <rect x="500" y="358" width="72" height="22" class="status-badge status-completed"/>
  <text x="510" y="374" fill="#16a34a" font-size="10" font-weight="600">Completed</text>
  <text x="630" y="373" class="td-text">王強</text>
  <text x="780" y="373" fill="#3b82f6" font-size="11">詳情</text>

  <!-- Pagination -->
  <text x="400" y="420" fill="#94a3b8" font-size="11">顯示 1-6 / 共 8 條</text>
  <text x="780" y="420" fill="#3b82f6" font-size="11">下一頁 →</text>
</svg>

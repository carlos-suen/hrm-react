<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <style>
      .sidebar { fill: #1e293b; rx: 12; }
      .logo { fill: #fff; font-size: 14px; font-weight: 700; }
      .divider { stroke: #334155; stroke-width: 1; }
      .nav-item { fill: #94a3b8; font-size: 12px; }
      .nav-item-active { fill: #fff; font-size: 12px; font-weight: 600; }
      .nav-icon { font-size: 14px; }
      .section-label { fill: #475569; font-size: 9px; font-weight: 600; letter-spacing: 0.5px; }
      .active-bg { fill: #3b82f6; rx: 6; opacity: 0.15; }
      .new-badge { fill: #22c55e; font-size: 8px; font-weight: 700; }
    </style>
  </defs>

  <rect width="220" height="340" class="sidebar"/>

  <!-- Logo -->
  <text x="20" y="36" class="logo">🏢 HRM System</text>
  <line x1="16" y1="50" x2="204" y2="50" class="divider"/>

  <!-- 4.1 Section -->
  <text x="20" y="72" class="section-label">基礎模塊</text>

  <rect x="12" y="82" width="196" height="28" class="active-bg"/>
  <text x="24" y="100" class="nav-item-active">📊 數據大盤</text>

  <text x="24" y="132" class="nav-item">👥 員工名冊</text>
  <text x="24" y="160" class="nav-item">✅ 請假審批</text>

  <line x1="16" y1="176" x2="204" y2="176" class="divider"/>

  <!-- 4.2 Section -->
  <text x="20" y="196" class="section-label">進階模塊</text>

  <text x="24" y="220" class="nav-item">🕐 考勤管理</text>
  <rect x="152" y="210" width="24" height="14" fill="#22c55e" rx="3"/>
  <text x="164" y="220" class="new-badge" text-anchor="middle">NEW</text>

  <text x="24" y="248" class="nav-item">💰 薪資管理</text>
  <rect x="152" y="238" width="24" height="14" fill="#22c55e" rx="3"/>
  <text x="164" y="248" class="new-badge" text-anchor="middle">NEW</text>

  <text x="24" y="276" class="nav-item">📋 招聘管理</text>
  <rect x="152" y="266" width="24" height="14" fill="#22c55e" rx="3"/>
  <text x="164" y="276" class="new-badge" text-anchor="middle">NEW</text>

  <text x="24" y="304" class="nav-item">🎓 培訓管理</text>
  <rect x="152" y="294" width="24" height="14" fill="#22c55e" rx="3"/>
  <text x="164" y="304" class="new-badge" text-anchor="middle">NEW</text>

  <line x1="16" y1="316" x2="204" y2="316" class="divider"/>
  <text x="24" y="336" class="nav-item">🌙 暗黑模式</text>
</svg>